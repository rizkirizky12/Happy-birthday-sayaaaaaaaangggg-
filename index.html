<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love! 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-pink: #fce4ec;
            --deep-rose: #d81b60;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(-45deg, #fce4ec, #ffd1dc, #ffc1cc, #f8bbd0);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Tombol Musik Melayang */
        #musicToggle {
            position: fixed; top: 20px; right: 20px;
            background: white; border: none; width: 50px; height: 50px;
            border-radius: 50%; cursor: pointer; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 24px;
            display: none; transition: 0.3s;
        }

        /* Layar Pembuka (Amplop) */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--soft-pink); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
            transition: 1s ease-in-out;
        }

        .overlay.hidden { transform: translateY(-100%); }

        .envelope-icon {
            font-size: 120px; cursor: pointer; animation: pulse 2s infinite;
            filter: drop-shadow(0 10px 15px rgba(216, 27, 96, 0.2));
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .overlay h2 {
            margin-top: 20px; font-family: 'Dancing Script', cursive;
            color: var(--deep-rose); font-size: 2rem;
        }

        /* Konten Utama */
        .container {
            width: 90%; max-width: 450px; text-align: center;
            background: var(--glass); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 30px; border: 2px solid white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            transform: scale(0.8); opacity: 0; transition: 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .container.show { transform: scale(1); opacity: 1; }

        /* Slideshow Polaroid */
        .slideshow {
            width: 100%; height: 320px; background: white;
            padding: 12px 12px 50px 12px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: rotate(-3deg); position: relative;
        }

        .slideshow img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; left: 12px; top: 12px; width: calc(100% - 24px);
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }

        .slideshow img.active { opacity: 1; }

        .slideshow::after {
            content: "You are the prettiest! ✨";
            position: absolute; bottom: 12px; left: 0; width: 100%;
            font-family: 'Dancing Script', cursive; font-size: 1.5rem; color: var(--deep-rose);
        }

        h1 {
            font-family: 'Dancing Script', cursive; color: var(--deep-rose);
            font-size: 2.5rem; margin-bottom: 15px;
        }

        #typing-box {
            font-size: 1.05rem; line-height: 1.8; color: #444;
            min-height: 120px; margin-bottom: 20px; font-weight: 600;
        }

        .footer-btn {
            background: var(--deep-rose); color: white; border: none;
            padding: 15px 35px; border-radius: 50px; cursor: pointer;
            font-weight: 600; font-size: 1rem; transition: 0.3s;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3);
        }

        .footer-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(216, 27, 96, 0.4); }

        /* Efek Partikel Hati & Bintang */
        .particle {
            position: absolute; pointer-events: none; animation: fly linear forwards;
            z-index: 100;
        }

        @keyframes fly {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="music" loop>
        <source src="https://www.mboxdrive.com/Happy%20Birthday%20Piano.mp3" type="audio/mp3">
    </audio>

    <button id="musicToggle" onclick="toggleMusic()">🎵</button>

    <div class="overlay" id="overlay" onclick="openSurprise()">
        <div class="envelope-icon">💌</div>
        <h2>Untuk yang Tercantik...</h2>
    </div>

    <div class="container" id="mainContainer">
        <div class="slideshow">
            <img src="foto1.jpg" class="active">
            <img src="foto2.jpg">
            <img src="foto3.jpg">
        </div>

        <h1>Happy Birthday, Cantik! ❤️</h1>
        <div id="typing-box"></div>

        <button class="footer-btn" onclick="bigSurprise()">Klik Kalau Kamu Sayang Aku</button>
    </div>

    <script>
        const audio = document.getElementById('music');
        const overlay = document.getElementById('overlay');
        const container = document.getElementById('mainContainer');
        const typeBox = document.getElementById('typing-box');
        const musicBtn = document.getElementById('musicToggle');

        const message = "Selamat ulang tahun untuk orang paling spesial di hidupku! ❤️\n\nTerima kasih ya sudah lahir dan jadi bagian terindah buat aku. Di usia baru ini, aku doakan semoga kamu selalu bahagia, sehat, dan makin cantik luar dalam. Aku janji bakal terus nemenin kamu di setiap langkah kamu. I love you so much! ✨💖";

        let charIdx = 0;
        let photoIdx = 0;
        const images = document.querySelectorAll('.slideshow img');

        function openSurprise() {
            overlay.classList.add('hidden');
            container.classList.add('show');
            musicBtn.style.display = 'block';
            
            // Putar Musik
            audio.volume = 0.5;
            audio.play();

            // Mulai Slideshow & Ketikan
            setInterval(changePhoto, 3500);
            setTimeout(typeWriter, 1000);
            setInterval(spawnParticle, 300);
        }

        function typeWriter() {
            if (charIdx < message.length) {
                let char = message.charAt(charIdx);
                typeBox.innerHTML += (char === "\n") ? "<br>" : char;
                charIdx++;
                setTimeout(typeWriter, 45);
            }
        }

        function changePhoto() {
            images[photoIdx].classList.remove('active');
            photoIdx = (photoIdx + 1) % images.length;
            images[photoIdx].classList.add('active');
        }

        function toggleMusic() {
            if (audio.paused) { audio.play(); musicBtn.innerHTML = '🎵'; }
            else { audio.pause(); musicBtn.innerHTML = '🔇'; }
        }

        function spawnParticle() {
            const p = document.createElement('div');
            p.classList.add('particle');
            const icons = ['❤️', '💖', '✨', '🌸', '🌹'];
            p.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = '-20px';
            p.style.fontSize = (Math.random() * 20 + 10) + 'px';
            p.style.animationDuration = (Math.random() * 3 + 4) + 's';
            p.style.opacity = Math.random();
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 6000);
        }

        function bigSurprise() {
            // Ledakan hati
            for(let i=0; i<40; i++) {
                setTimeout(spawnParticle, i * 50);
            }
            alert("I Love You More! 🥰 Cek kado asli di depan kamu (kalau ada) ya! Hahaha 💖");
        }
    </script>
</body>
</html>
